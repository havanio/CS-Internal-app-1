<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTMI SK CS INTERNAL APP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CUSTOMER SERVICE APP</p>
          <h1>KỊCH BẢN CHAT VÀ THÔNG TIN CTKM</h1>
          <p id="dataSource" class="data-source">Loading Google Sheet...</p>
        </div>
        <div class="topbar-actions">
          <button id="clearButton" class="icon-button subtle" type="button" title="Clear filters">Reset</button>
        </div>
      </header>

      <div id="imageWarningBanner" class="notice notice-warning" hidden></div>

      <main class="workspace">
        <section class="filter-board" aria-label="Filters">
          <section class="filter-section">
            <div class="section-title">Brand</div>
            <div id="brandFilters" class="filter-row" role="group" aria-label="Brand filter"></div>
          </section>

          <section class="filter-section">
            <div class="section-title">Content</div>
            <div id="typeFilters" class="filter-row" role="group" aria-label="Content type filter"></div>
          </section>

          <section class="filter-section">
            <div class="section-title">Category</div>
            <div id="categoryFilters" class="category-row" role="group" aria-label="Category filter"></div>
          </section>
        </section>

        <section class="content-area">
          <div class="content-header">
            <div>
              <p id="resultSummary" class="muted"></p>
              <h2 id="currentView">All Support Content</h2>
            </div>
            <select id="statusFilter" aria-label="Promotion status filter">
              <option value="all">All statuses</option>
              <option value="active">Active promos</option>
              <option value="upcoming">Upcoming promos</option>
              <option value="expired">Expired promos</option>
            </select>
          </div>

          <section id="storeSearchSection" class="store-search" hidden>
            <label class="field-label" for="searchInput">Search Stores</label>
            <input id="searchInput" type="search" placeholder="Search store name, address, phone, manager" autocomplete="off" />
          </section>

          <div id="results" class="results-grid" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>No matching content</h3>
            <p>Try a different brand, content type, category, or store search keyword.</p>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
