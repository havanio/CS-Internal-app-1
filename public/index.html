<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTMI SK CS INTERNAL APP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CUSTOMER SERVICE APP</p>
          <h1>KỊCH BẢN CHAT VÀ THÔNG TIN CTKM</h1>
          <p id="dataSource" class="data-source">Đang tải dữ liệu...</p>
        </div>
        <div class="topbar-actions">
          <button id="clearButton" class="icon-button subtle" type="button" title="Đặt lại bộ lọc">Đặt lại</button>
        </div>
      </header>

      <div id="imageWarningBanner" class="notice notice-warning" hidden></div>

      <main class="workspace">
        <section class="filter-board" aria-label="Filters">
          <section class="filter-section">
            <div class="section-title">Brand</div>
            <div id="brandFilters" class="filter-row" role="group" aria-label="Bộ lọc brand"></div>
          </section>

          <section class="filter-section">
            <div class="section-title">Loại nội dung</div>
            <div id="typeFilters" class="filter-row" role="group" aria-label="Bộ lọc loại nội dung"></div>
          </section>

          <section class="filter-section">
            <div class="section-title">Danh mục</div>
            <div id="categoryFilters" class="category-row" role="group" aria-label="Bộ lọc danh mục"></div>
          </section>
        </section>

        <section class="content-area">
          <div class="content-header">
            <div>
              <p id="resultSummary" class="muted"></p>
              <h2 id="currentView">Tất cả nội dung hỗ trợ</h2>
            </div>
            <select id="statusFilter" aria-label="Bộ lọc trạng thái CTKM">
              <option value="all">Tất cả trạng thái</option>
              <option value="active">Đang áp dụng</option>
              <option value="upcoming">Sắp áp dụng</option>
              <option value="expired">Đã hết hạn</option>
            </select>
          </div>

          <section id="storeSearchSection" class="store-search" hidden>
            <label class="field-label" for="searchInput">Tìm cửa hàng</label>
            <input id="searchInput" type="search" placeholder="Tìm theo tên cửa hàng, địa chỉ, số điện thoại, quản lý" autocomplete="off" />
          </section>

          <div id="results" class="results-grid" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>Không có nội dung phù hợp</h3>
            <p>Thử đổi brand, loại nội dung, danh mục hoặc từ khoá tìm kiếm.</p>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
